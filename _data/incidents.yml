# Super Intelligent Incidents — one entry per public incident caused by an AI agent.
# Keep entries factual and link to a primary or reputable source.
# Fields:
#   title:    headline, as the source calls it (or a neutral summary)
#   org:      who was affected or who published it
#   agent:    the AI agent / tool / model that did the thing
#   source:   blog post | news | postmortem | GitHub issue | advisory | research | talk
#   kind:     security    - an attacker got something through the agent (leak, exfiltration, backdoor, supply chain)
#             destruction - the agent broke or deleted something on its own (wiped data, lost files, outage)
#             rogue       - no attacker, nothing destroyed, but the agent went off-script (invented policy, made commitments, bypassed limits, lied)
#   date:     YYYY-MM-DD (publication date of the source)
#   url:      link to the story
#   involved: short tags for the mechanisms behind the incident
#   impact:   one line on the consequences

- title: "Clinejection: compromising Cline's production releases just by prompting an issue triager"
  org: Cline
  agent: Cline AI issue triager (GitHub Actions)
  source: research
  kind: security
  date: 2026-02-09
  url: https://adnanthekhan.com/posts/clinejection/
  involved: [prompt injection via GitHub issue, CI/CD secrets, GitHub Actions, release pipeline]
  impact: attacker-controlled issue text could reach release credentials and poison production builds (responsibly disclosed)

