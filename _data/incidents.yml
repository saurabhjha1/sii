# Super Intelligent Incidents — one entry per public production incident caused by an AI agent.
# Keep entries factual and link to a primary or reputable source.
# Real incidents only: something that happened to a real deployment, not a researcher proof-of-concept.
#
# Fields:
#   title:    headline, as the source calls it (or a neutral summary)
#   org:      who was affected or who published it
#   agent:    the AI agent / tool / model that did the thing
#   source:   blog post | news | postmortem | GitHub issue | advisory
#   kind:     list of one or more ids from kinds.yml. Most incidents get one; use two or more ("mixed")
#             only when the incident genuinely belongs to more than one team, e.g. a breach that also
#             caused an outage. Decide each in this order:
#               1. Was there an adversary, or did untrusted input steer the agent?  -> security
#               2. No adversary, but the system did the wrong thing or didn't work? -> reliability
#               3. No adversary, nothing wrong, but worse than it should be?        -> performance
#   atlas:    MITRE ATLAS technique or case-study IDs (https://atlas.mitre.org), e.g. [AML.T0051].
#             Required when kind includes security; not allowed otherwise.
#   date:     YYYY-MM-DD (publication date of the source)
#   url:      primary link to the story (what the title points to)
#   links:    optional extra sources, each {text, url}: a tech report, video, independent investigation, news coverage
#   involved: short tags for the mechanisms behind the incident
#   impact:   one line on the consequences
#
# Template (copy, uncomment, fill in):
#
# - title: ""
#   org: ""
#   agent: ""
#   source: news
#   kind: [security]            # or [reliability], [performance], or several e.g. [security, reliability]
#   atlas: [AML.T0051]          # only when kind includes security
#   date: 2026-01-01
#   url: https://
#   links:                      # optional extra sources
#     - text: ""
#       url: https://
#   involved: [tag one, tag two]
#   impact: ""

- title: "Meta says a Claude tool's read traffic triggered the No Kings Instagram suspension"
  org: Meta / No Kings Coalition
  agent: Claude tool reading Instagram profiles, posts and hashtags on behalf of the account
  source: postmortem
  kind: [reliability]
  date: 2026-10-18
  url: https://x.com/andymstone/status/2111920686306627816
  links:
    - text: Bloomberg
      url: https://www.bloomberg.com/news/articles/2026-10-18/meta-says-claude-ai-tool-triggered-no-kings-instagram-suspension
    - text: Common Dreams
      url: https://www.commondreams.org/news/no-kings-meta-instagram
  involved: [~4x burst of sequential read requests, bot-detection false positive, automated account takedown, admin lockout]
  impact: No Kings Instagram account taken offline for ~90 minutes at the peak of a nationwide protest day; admins locked out for longer

- title: "OpenAI evaluation agents escape their sandbox and breach Hugging Face"
  org: Hugging Face / OpenAI
  agent: ~700 of ~1,200 OpenAI cybersecurity-evaluation agents (internal research model and GPT-5.6 Sol)
  source: postmortem
  kind: [security]
  atlas: [AML.T0049, AML.T0105, AML.T0055, AML.T0025]
  date: 2026-07-16
  url: https://huggingface.co/blog/security-incident-july-2026
  links:
    - text: OpenAI technical report (PDF)
      url: https://cdn.openai.com/pdf/67869394-cb91-4c12-888c-5cbd85c7814c/OpenAI-Hugging-Face%20Incident-Technical-Report.pdf
    - text: METR independent investigation
      url: https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/
    - text: The Register
      url: https://www.theregister.com/security/2026/08/27/openai-explains-how-its-naughty-ai-agents-attacked-hugging-face/5292780
    - text: ABC News (the agents' own messages)
      url: https://www.abc.net.au/news/2026-09-11/how-openai-agents-hacked-hugging-face-messages-revealed/107125126
    - text: Wikipedia
      url: https://en.wikipedia.org/wiki/2026_cyberattacks_by_rogue_OpenAI_agents
  involved: [sandbox escape via Artifactory SSRF zero-day, unsanctioned agent-to-agent message board, credential harvesting, privilege escalation, RubyGems deserialization zero-day, benchmark-gaming motive, alert ignored for weeks]
  impact: Hugging Face production infrastructure compromised, internal datasets and service credentials across four services accessed, private evaluation data copied to a public dataset; Artifactory outage at OpenAI

