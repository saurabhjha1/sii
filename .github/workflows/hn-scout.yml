name: hn scout
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours of Hacker News to scan"
        default: "36"
      dry_run:
        description: "Print drafts but open nothing"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency: hn-scout
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: pip install -r scripts/requirements.txt
      - name: Scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.HN_SCOUT_TOKEN || github.token }}
        run: |
          python scripts/hn_scout.py \
            --hours "${{ github.event.inputs.hours || '36' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
